services:
  - type: web
    name: tradescalc-api
    runtime: python
    plan: starter
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn src.tradescalc.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: TRADESCALC_ENV
        value: production
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
      - key: TRADESCALC_API_KEY_SALT
        sync: false
    autoDeploy: true
    healthCheckPath: /health
    region: oregon
