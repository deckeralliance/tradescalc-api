[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradescalc"
version = "0.1.0"
description = "TradesCalc — The Infrastructure API for the Trades. NEC electrical calculations, utility reliability indices, and fire protection engineering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "James W", email = "james@tradescalc.dev" },
]
keywords = ["api", "electrical", "nec", "calculator", "trades", "utility", "fire"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://tradescalc.dev"
Documentation = "https://docs.tradescalc.dev"
Repository = "https://github.com/tradescalc/tradescalc-api"
Issues = "https://github.com/tradescalc/tradescalc-api/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/tradescalc"]
